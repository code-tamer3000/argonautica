name: Deploy site

on:
  push:
    branches: [main, develop]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deps
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Resolve remote path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "REMOTE_PATH=/root/argonautica-site/" >> "$GITHUB_ENV"
          else
            echo "REMOTE_PATH=/root/argonautica-site-preview/" >> "$GITHUB_ENV"
          fi

      - name: Deploy over rsync/ssh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 -D /dev/stdin ~/.ssh/deploy_key <<< "$SSH_KEY"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            site/dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_PATH"
